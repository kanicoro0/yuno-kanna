name: Yuno check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yuno-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: yuno-bot/requirements.txt
      - run: python -m pip install -q -r requirements.txt
      - name: Compile Yuno
        run: python -m compileall main.py yuno tests
      - name: Run Yuno tests
        run: python -m unittest discover -s tests
      - name: Smoke create bot
        run: python -c "from yuno.app import create_bot; bot=create_bot(); print('bot ok')"

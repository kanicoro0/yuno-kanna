name: Yuno check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yuno-bot-v2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: yuno-bot-v2.0/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_yuno.py
